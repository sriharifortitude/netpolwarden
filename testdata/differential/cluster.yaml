# Applied to a real cluster by scripts/differential.sh. Every pod runs agnhost netexec, which
# answers on its declared port, so each connection can be tried for real and compared with
# netpolwarden's answer. No ipBlock: plugins differ on whether pod addresses fall inside one.
apiVersion: v1
kind: Namespace
metadata: {name: np-x, labels: {team: alpha}}
---
apiVersion: v1
kind: Namespace
metadata: {name: np-y, labels: {team: beta}}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: np-x, labels: {app: web}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: [netexec, --http-port=80], ports: [{name: http, containerPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: np-x, labels: {app: api}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: [netexec, --http-port=81], ports: [{name: api, containerPort: 81}]}
---
apiVersion: v1
kind: Pod
metadata: {name: db, namespace: np-x, labels: {app: db}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: [netexec, --http-port=82], ports: [{name: sql, containerPort: 82}]}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: np-y, labels: {app: web}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: [netexec, --http-port=80], ports: [{name: http, containerPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: tool, namespace: np-y, labels: {app: tool}}
spec:
  containers:
    - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: [netexec, --http-port=83], ports: [{name: http, containerPort: 83}]}
---
# np-x: closed to ingress by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: np-x}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# api: from web in any namespace labelled team=beta AND app=web (one peer), on the named port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-and, namespace: np-x}
spec:
  podSelector: {matchLabels: {app: api}}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {team: beta}}
          podSelector: {matchLabels: {app: web}}
      ports: [{port: api}]
---
# web: from every pod in team=beta namespaces OR app=api in np-x (two peers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-or, namespace: np-x}
spec:
  podSelector: {matchLabels: {app: web}}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {team: beta}}
        - podSelector: {matchLabels: {app: api}}
---
# db: from api only, on 82, and a named port that no db container declares (lets nothing in).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: db-from-api, namespace: np-x}
spec:
  podSelector: {matchLabels: {app: db}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: api}}}]
      ports: [{port: 82}]
    - from: [{podSelector: {matchLabels: {app: web}}}]
      ports: [{port: postgres}]
---
# np-y tool: may only connect to np-x api, on 81. Everything else it tries is refused on the way out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tool-egress, namespace: np-y}
spec:
  podSelector: {matchLabels: {app: tool}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: np-x}}
          podSelector: {matchLabels: {app: api}}
      ports: [{port: 81}]
